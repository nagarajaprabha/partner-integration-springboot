# ═══════════════════════════════════════════════════════════════════
# fastag.properties — Spring Cloud Config Server
# ═══════════════════════════════════════════════════════════════════

# ── Oracle DB ───────────────────────────────────────────────────────
fastag.db.host=${FASTAG_DB_HOST}
fastag.db.port=${FASTAG_DB_PORT:1521}
fastag.db.schema=${FASTAG_DB_SCHEMA}
fastag.db.service-name=${FASTAG_DB_SERVICE_NAME}
fastag.db.hikari.minimum-idle=2
fastag.db.hikari.maximum-pool-size=10

# Vault injects at runtime (secret/integration/fastag):
# fastag.db.username
# fastag.db.password
# fastag.aerospike.username
# fastag.aerospike.password

# ── Aerospike ────────────────────────────────────────────────────────
fastag.aerospike.host=${FASTAG_AS_HOST}
fastag.aerospike.port=${FASTAG_AS_PORT:3000}
fastag.aerospike.namespace=${FASTAG_AS_NAMESPACE}

# ── Step files ───────────────────────────────────────────────────────
fastag.steps=\
  /integration-config/fastag/steps/step1.sql,\
  /integration-config/fastag/steps/step2.sql,\
  /integration-config/fastag/steps/step3.aql,\
  /integration-config/fastag/steps/step4.sql,\
  /integration-config/fastag/steps/rollback1.sql,\
  /integration-config/fastag/steps/rollback2.sql,\
  /integration-config/fastag/steps/rollback3.sql

# ── Upload folder ────────────────────────────────────────────────────
fastag.upload.path=/uploads/fastag

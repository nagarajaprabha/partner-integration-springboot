# ═══════════════════════════════════════════════════════════════════
# cms.properties — Spring Cloud Config Server
# ═══════════════════════════════════════════════════════════════════

# ── Oracle DB ───────────────────────────────────────────────────────
cms.db.host=${CMS_DB_HOST}
cms.db.port=${CMS_DB_PORT:1521}
cms.db.schema=${CMS_DB_SCHEMA}
cms.db.service-name=${CMS_DB_SERVICE_NAME}
cms.db.hikari.minimum-idle=2
cms.db.hikari.maximum-pool-size=10

# Vault injects at runtime (secret/integration/cms):
# cms.db.username
# cms.db.password

# ── Step files ───────────────────────────────────────────────────────
cms.steps=\
  /integration-config/cms/steps/step1.sql,\
  /integration-config/cms/steps/step2.sql,\
  /integration-config/cms/steps/step3.sql,\
  /integration-config/cms/steps/rollback1.sql,\
  /integration-config/cms/steps/rollback2.sql,\
  /integration-config/cms/steps/rollback3.sql

# ── Upload folder ────────────────────────────────────────────────────
cms.upload.path=/uploads/cms

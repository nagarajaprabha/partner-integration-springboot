# ═══════════════════════════════════════════════════════════════════
# dmt.properties — Spring Cloud Config Server
# All DMT use case config lives here.
# Credentials (username/password) injected by Vault at runtime.
# ═══════════════════════════════════════════════════════════════════

# ── Oracle DB ───────────────────────────────────────────────────────
dmt.db.host=${DMT_DB_HOST}
dmt.db.port=${DMT_DB_PORT:1521}
dmt.db.schema=${DMT_DB_SCHEMA}
dmt.db.service-name=${DMT_DB_SERVICE_NAME}
dmt.db.hikari.minimum-idle=2
dmt.db.hikari.maximum-pool-size=10

# Vault injects at runtime (secret/integration/dmt):
# dmt.db.username
# dmt.db.password

# ── Step files — comma-separated absolute paths ──────────────────────
# StepLoader reads these files in declaration order.
# Execution order is governed by STEP_ID inside each file.
dmt.steps=\
  /integration-config/dmt/steps/step1.sql,\
  /integration-config/dmt/steps/step2.sql,\
  /integration-config/dmt/steps/step3.sql,\
  /integration-config/dmt/steps/rollback1.sql,\
  /integration-config/dmt/steps/rollback2.sql

# ── Upload folder ────────────────────────────────────────────────────
dmt.upload.path=/uploads/dmt

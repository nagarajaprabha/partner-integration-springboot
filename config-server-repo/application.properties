# ═══════════════════════════════════════════════════════════════════
# application.properties — Spring Cloud Config Server (shared)
# Applies to ALL use cases. Per-use-case config in {usecase}.properties
# ═══════════════════════════════════════════════════════════════════

# ── Shared SFTP Connection ───────────────────────────────────────────
# One SFTP server for all use cases.
# Subfolders per use case: {sftp.upload.root}/{usecase}/
# Credentials injected by Vault: secret/integration/sftp
sftp.host=${SFTP_HOST}
sftp.port=${SFTP_PORT:22}
sftp.upload.root=/uploads
sftp.processed.subfolder=processed
sftp.local.staging.root=${java.io.tmpdir}/pip-staging

# ── Poller settings ──────────────────────────────────────────────────
integration.poller.interval.seconds=10
integration.poller.max.messages.per.poll=10

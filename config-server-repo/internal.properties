# ═══════════════════════════════════════════════════════════════════
# internal.properties — Spring Cloud Config Server
# ═══════════════════════════════════════════════════════════════════

# ── Oracle DB ───────────────────────────────────────────────────────
internal.db.host=${INTERNAL_DB_HOST}
internal.db.port=${INTERNAL_DB_PORT:1521}
internal.db.schema=${INTERNAL_DB_SCHEMA}
internal.db.service-name=${INTERNAL_DB_SERVICE_NAME}
internal.db.hikari.minimum-idle=2
internal.db.hikari.maximum-pool-size=10

# Vault injects at runtime (secret/integration/internal):
# internal.db.username
# internal.db.password
# internal.aerospike.username
# internal.aerospike.password

# ── Aerospike ────────────────────────────────────────────────────────
internal.aerospike.host=${INTERNAL_AS_HOST}
internal.aerospike.port=${INTERNAL_AS_PORT:3000}
internal.aerospike.namespace=${INTERNAL_AS_NAMESPACE}

# ── Step files ───────────────────────────────────────────────────────
internal.steps=\
  /integration-config/internal/steps/step1.sql,\
  /integration-config/internal/steps/step2.sql,\
  /integration-config/internal/steps/step3.aql,\
  /integration-config/internal/steps/rollback1.sql,\
  /integration-config/internal/steps/rollback2.sql,\
  /integration-config/internal/steps/rollback3.sql

# ── Upload folder ────────────────────────────────────────────────────
internal.upload.path=/uploads/internal

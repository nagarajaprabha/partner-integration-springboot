# ═══════════════════════════════════════════════════════════════════
# application.properties
# App-level settings loaded after Spring Cloud Config + Vault.
# Connection details come from Spring Cloud Config per use case.
# Credentials come from Vault per use case.
# ═══════════════════════════════════════════════════════════════════

# ── Logging ─────────────────────────────────────────────────────────
logging.level.com.integration=INFO
logging.level.org.springframework=WARN
logging.level.com.zaxxer.hikari=WARN

# ── Server ──────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── File intake paths (outside the application) ─────────────────────
# Root folder where step files, db.properties, validations live
integration.config.root=${CONFIG_ROOT:/integration-config}

# Root folder where pollers watch for incoming CSV/JSON files
integration.upload.root=${UPLOAD_ROOT:/uploads}

# Audit log — append-only
integration.audit.log.path=${AUDIT_LOG_PATH:/var/log/partner-integration/audit.log}

# Poll interval in seconds — how often each poller checks its folder
integration.poller.interval.seconds=${POLL_INTERVAL_SECONDS:10}

# ── Use cases ────────────────────────────────────────────────────────
# Comma-separated list of active use cases
# Adding a new use case = add name here + add its properties to Config Server
integration.usecases=dmt,cms,fastag,internal

# ── HikariCP defaults (overridden per use case in BaseDBConfig) ──────
integration.hikari.minimum-idle=2
integration.hikari.maximum-pool-size=10
integration.hikari.connection-timeout=30000
integration.hikari.idle-timeout=600000
integration.hikari.max-lifetime=1800000
integration.hikari.connection-test-query=SELECT 1 FROM DUAL

# ── Aerospike defaults ───────────────────────────────────────────────
integration.aerospike.timeout=3000
integration.aerospike.max-connections=50

# ── Spring autoconfigure exclusions ─────────────────────────────────
# Exclude default DataSource autoconfiguration — we build per-use-case
# DataSources manually in BaseDBConfig
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# ── Spring Actuator — expose refresh endpoint for dynamic use case reload ──
management.endpoints.web.exposure.include=health,info,refresh
management.endpoint.refresh.enabled=true

# ── Spring Security OAuth2 Resource Server ───────────────────────────
# Generic OIDC — provider-agnostic. Customer sets their IdP issuer URI.
# Examples:
#   Keycloak : http://keycloak:8080/realms/{realm}
#   Azure AD : https://login.microsoftonline.com/{tenant}/v2.0
#   Okta     : https://{domain}/oauth2/default
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI}

# JWT claim that carries roles — varies by IdP, configure per deployment
# Keycloak: realm_access.roles  Azure AD: roles  Okta: groups
integration.security.roles-claim=${OIDC_ROLES_CLAIM:roles}

# Role values expected in JWT — must match IdP group/role names
integration.security.role.operator=${OIDC_ROLE_OPERATOR:OPERATOR}
integration.security.role.viewer=${OIDC_ROLE_VIEWER:VIEWER}
integration.security.role.admin=${OIDC_ROLE_ADMIN:ADMIN}

# ── CORS ─────────────────────────────────────────────────────────────
# Frontend origin — set to actual frontend URL in production
integration.security.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

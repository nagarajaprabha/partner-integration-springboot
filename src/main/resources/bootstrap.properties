# ═══════════════════════════════════════════════════════════════════
# bootstrap.properties
# Loaded BEFORE application context starts.
# Connects to Spring Cloud Config Server and Hashicorp Vault.
# All sensitive values come from environment variables — never hardcoded.
# ═══════════════════════════════════════════════════════════════════

# ── Application identity ────────────────────────────────────────────
# Spring Cloud Config Server uses this name to locate property files.
# Config server will serve one .properties file per use case listed below.
spring.application.name=partner-integration

# Active profile — drives which config is loaded (dev/uat/prod)
spring.profiles.active=${APP_ENV:dev}

# ── Active use cases ────────────────────────────────────────────────
# Comma-separated use case names.
# Spring Cloud Config Server loads {name}.properties for each entry.
# Adding a new use case = add its name here + add its .properties
# to the Config Server repo. Zero code changes.
integration.usecases=dmt,cms,fastag,internal

# ── Spring Cloud Config Server ──────────────────────────────────────
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.enabled=true
spring.cloud.config.fail-fast=true
spring.cloud.config.retry.max-attempts=3
spring.cloud.config.retry.initial-interval=2000

# ── Hashicorp Vault ─────────────────────────────────────────────────
# Vault stores ONLY credentials per use case:
#   secret/integration/{usecase} → db.username, db.password
#   secret/integration/{usecase} → aerospike.username, aerospike.password (if applicable)
spring.cloud.vault.enabled=true
spring.cloud.vault.uri=${VAULT_URI:http://localhost:8200}
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.token=${VAULT_TOKEN}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=integration
spring.cloud.vault.fail-fast=true
spring.cloud.vault.kv.application-name=\
  integration/dmt,\
  integration/cms,\
  integration/fastag,\
  integration/internal
